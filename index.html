<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 30px;
}

button {
  padding: 12px 24px;
  font-size: 16px;
}

#sonuc {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>ServisNET ASTİS - Veritabanı Test</h2>

<button onclick="testConnection()">Veritabanı Test Et</button>

<div id="sonuc"></div>

<script>
const supabaseUrl = "https://estdjfvlpebkmelzewjo.supabase.co";
const supabaseKey = "sb_publishable_YnjXKncf6BGO6gMa4bzAhA_66duBIov";

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function testConnection() {
  document.getElementById("sonuc").innerText = "Bağlanıyor...";

  const { data, error } = await client
    .from("companies")
    .select("*")
    .limit(1);

  if (error) {
    document.getElementById("sonuc").innerText = "❌ HATA: " + error.message;
  } else {
    document.getElementById("sonuc").innerText = "✅ VERİTABANI BAĞLANDI";
  }
}
</script>

</body>
