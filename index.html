<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServisNET ASTİS - ANA PANEL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:20px;
  margin:0;
}

h2 {
  margin-bottom:20px;
}

button {
  padding:10px 20px;
  margin:5px 5px 5px 0;
  cursor:pointer;
  border:1px solid #999;
  border-radius:4px;
  background:white;
}

button:hover {
  background:#f0f0f0;
}

.menu {
  margin-bottom:20px;
}

.kutu {
  background:white;
  padding:15px;
  border-radius:8px;
  margin-top:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.05);
}

.sirket-satir {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.sirket-satir:hover {
  background:#f7f7f7;
}

.detay-baslik {
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.bilgi-satir {
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.etiket {
  font-weight:bold;
  display:inline-block;
  min-width:160px;
}

.uyari {
  background:#fff8e1;
  border:1px solid #ffe082;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}

.hata {
  background:#ffebee;
  border:1px solid #ef9a9a;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}

.basarili {
  background:#e8f5e9;
  border:1px solid #a5d6a7;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}

input, select {
  width:100%;
  max-width:500px;
  padding:10px;
  margin:5px 0 15px 0;
  border:1px solid #ccc;
  border-radius:4px;
  box-sizing:border-box;
}

.form-etiket {
  font-weight:bold;
  display:block;
  margin-top:5px;
}

.yonetim-buton {
  background:#0f172a;
  color:white;
  border-color:#0f172a;
}

.yonetim-buton:hover {
  background:#1e293b;
}

.pasif-buton {
  background:#b91c1c;
  color:white;
  border-color:#b91c1c;
}

.pasif-buton:hover {
  background:#991b1b;
}
</style>
</head>

<body>

<h2>ServisNET ASTİS ANA PANEL</h2>

<div class="menu">
  <button onclick="listele()">Şirketleri Getir</button>
</div>

<div id="icerik" class="kutu">Hazır</div>

<script>
const supabaseUrl = "https://estdjfvlpebkmelzewjo.supabase.co";
const supabaseKey = "sb_publishable_YnjXKncf6BGO6gMa4bzAhA_66duBIov";

const client = supabase.createClient(supabaseUrl, supabaseKey);

let sirketler = [];
let aktifIndex = null;

function temizle(deger) {
  if (deger === null || deger === undefined || deger === "") return "-";

  return String(deger)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formDeger(deger) {
  if (deger === null || deger === undefined) return "";
  return String(deger)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function alanAdiGoster(alan) {
  const sozluk = {
    id: "ID",
    title: "Şirket Ünvanı",
    name: "Ad",
    company_name: "Şirket Adı",
    tax_number: "Vergi No",
    tax_no: "Vergi No",
    tax_office: "Vergi Dairesi",
    phone: "Telefon",
    email: "E-posta",
    address: "Adres",
    opening_vat: "Açılış KDV",
    status: "Durum",
    active: "Aktif",
    is_active: "Aktif",
    created_at: "Kayıt Tarihi",
    updated_at: "Güncelleme Tarihi"
  };

  return sozluk[alan] || alan;
}

async function listele() {
  const kutu = document.getElementById("icerik");
  kutu.innerHTML = "Şirketler yükleniyor...";

  const { data, error } = await client
    .from("companies")
    .select("*");

  if (error) {
    kutu.innerHTML = "<div class='hata'><b>HATA:</b> " + temizle(error.message) + "</div>";
    return;
  }

  sirketler = data || [];

  if (sirketler.length === 0) {
    kutu.innerHTML = "<b>Şirket Listesi</b><br><br>Kayıt bulunamadı.";
    return;
  }

  let html = "<b>Şirket Listesi</b><br><br>";

  sirketler.forEach((sirket, index) => {
    const baslik =
      sirket.title ||
      sirket.name ||
      sirket.company_name ||
      "Şirket #" + (index + 1);

    const durum = sirket.is_active === false ? " - PASİF" : "";

    html += "<div class='sirket-satir' onclick='detayGoster(" + index + ")'>🏢 " + temizle(baslik) + temizle(durum) + "</div>";
  });

  kutu.innerHTML = html;
}

function detayGoster(index) {
  aktifIndex = index;

  const sirket = sirketler[index];
  const kutu = document.getElementById("icerik");

  if (!sirket) {
    kutu.innerHTML = "<div class='hata'>Şirket kaydı bulunamadı.</div>";
    return;
  }

  const baslik =
    sirket.title ||
    sirket.name ||
    sirket.company_name ||
    "Şirket Detayı";

  let html = "";

  html += "<button class='yonetim-buton' onclick='yonetimGoster(" + index + ")'>Şirket Yönetimi</button>";
  html += "<button onclick='listele()'>← Şirket Listesine Dön</button>";

  html += "<div class='detay-baslik'>🏢 " + temizle(baslik) + "</div>";

  Object.keys(sirket).forEach(alan => {
    html += "<div class='bilgi-satir'>";
    html += "<span class='etiket'>" + temizle(alanAdiGoster(alan)) + ":</span> ";
    html += temizle(sirket[alan]);
    html += "</div>";
  });

  kutu.innerHTML = html;
}

function yonetimGoster(index) {
  aktifIndex = index;

  const sirket = sirketler[index];
  const kutu = document.getElementById("icerik");

  if (!sirket) {
    kutu.innerHTML = "<div class='hata'>Şirket kaydı bulunamadı.</div>";
    return;
  }

  const baslik =
    sirket.title ||
    sirket.name ||
    sirket.company_name ||
    "Şirket Yönetimi";

  let html = "";

  html += "<button onclick='detayGoster(" + index + ")'>← Detaya Dön</button>";
  html += "<button onclick='listele()'>Şirket Listesi</button>";

  html += "<div class='detay-baslik'>⚙️ " + temizle(baslik) + " - Şirket Yönetimi</div>";

  html += "<div id='mesaj'></div>";

  html += "<label class='form-etiket'>Şirket Ünvanı</label>";
  html += "<input id='title' value=\"" + formDeger(sirket.title) + "\">";

  html += "<label class='form-etiket'>Vergi Dairesi</label>";
  html += "<input id='tax_office' value=\"" + formDeger(sirket.tax_office) + "\">";

  html += "<label class='form-etiket'>Vergi No</label>";
  html += "<input id='tax_no' value=\"" + formDeger(sirket.tax_no) + "\">";

  html += "<label class='form-etiket'>Açılış KDV</label>";
  html += "<input id='opening_vat' type='number' value=\"" + formDeger(sirket.opening_vat) + "\">";

  html += "<label class='form-etiket'>Durum</label>";
  html += "<select id='is_active'>";
  html += "<option value='true' " + (sirket.is_active === true ? "selected" : "") + ">Aktif</option>";
  html += "<option value='false' " + (sirket.is_active === false ? "selected" : "") + ">Pasif</option>";
  html += "</select>";

  html += "<br>";
  html += "<button class='yonetim-buton' onclick='sirketKaydet()'>Kaydet</button>";
  html += "<button class='pasif-buton' onclick='pasifeAl()'>Pasife Al</button>";

  kutu.innerHTML = html;
}

async function sirketKaydet() {
  const mesaj = document.getElementById("mesaj");
  const sirket = sirketler[aktifIndex];

  if (!sirket) {
    mesaj.innerHTML = "<div class='hata'>Şirket kaydı bulunamadı.</div>";
    return;
  }

  const yeniVeri = {
    title: document.getElementById("title").value,
    tax_office: document.getElementById("tax_office").value,
    tax_no: document.getElementById("tax_no").value,
    opening_vat: Number(document.getElementById("opening_vat").value || 0),
    is_active: document.getElementById("is_active").value === "true"
  };

  mesaj.innerHTML = "Kaydediliyor...";

  const { error } = await client
    .from("companies")
    .update(yeniVeri)
    .eq("id", sirket.id);

  if (error) {
    mesaj.innerHTML = "<div class='hata'><b>Kayıt hatası:</b> " + temizle(error.message) + "</div>";
    return;
  }

  mesaj.innerHTML = "<div class='basarili'>Şirket bilgileri güncellendi.</div>";

  await listele();
}

async function pasifeAl() {
  const sirket = sirketler[aktifIndex];

  if (!sirket) {
    document.getElementById("mesaj").innerHTML = "<div class='hata'>Şirket kaydı bulunamadı.</div>";
    return;
  }

  const onay = confirm("Bu şirket pasife alınacak. Devam edilsin mi?");
  if (!onay) return;

  const { error } = await client
    .from("companies")
    .update({ is_active: false })
    .eq("id", sirket.id);

  if (error) {
    document.getElementById("mesaj").innerHTML = "<div class='hata'><b>Pasife alma hatası:</b> " + temizle(error.message) + "</div>";
    return;
  }

  alert("Şirket pasife alındı.");
  await listele();
}

listele();
</script>

</body>
</html>
