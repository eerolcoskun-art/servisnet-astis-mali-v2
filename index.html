<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServisNET ASTİS - Belge Takip</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f4f5;
  margin:0;
  padding:20px;
  color:#111827;
}

h2 {
  margin-bottom:5px;
}

.alt-baslik {
  color:#6b7280;
  margin-bottom:20px;
}

.menu {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button {
  padding:10px 18px;
  border:1px solid #9ca3af;
  border-radius:6px;
  background:white;
  cursor:pointer;
  font-weight:600;
}

button:hover {
  background:#f3f4f6;
}

.ana-buton {
  background:#111827;
  color:white;
  border-color:#111827;
}

.ana-buton:hover {
  background:#1f2937;
}

.yesil {
  background:#15803d;
  color:white;
  border-color:#15803d;
}

.kirmizi {
  background:#b91c1c;
  color:white;
  border-color:#b91c1c;
}

.kutu {
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

.form-grid {
  display:grid;
  grid-template-columns: repeat(3, minmax(200px, 1fr));
  gap:14px;
}

label {
  font-weight:bold;
  display:block;
  margin-bottom:6px;
}

input, select, textarea {
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:6px;
  box-sizing:border-box;
}

textarea {
  min-height:70px;
}

.tam {
  grid-column:1 / -1;
}

.mesaj {
  padding:10px;
  border-radius:6px;
  margin-bottom:15px;
  display:none;
}

.basarili {
  display:block;
  background:#dcfce7;
  border:1px solid #86efac;
}

.hata {
  display:block;
  background:#fee2e2;
  border:1px solid #fca5a5;
}

.filtreler {
  display:grid;
  grid-template-columns: repeat(5, minmax(160px, 1fr));
  gap:10px;
  margin-bottom:15px;
}

table {
  width:100%;
  border-collapse:collapse;
  background:white;
}

th, td {
  border-bottom:1px solid #e5e7eb;
  padding:9px;
  text-align:left;
  font-size:14px;
}

th {
  background:#f9fafb;
}

.sag {
  text-align:right;
}

.ozet {
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin:15px 0;
}

.ozet-kutu {
  background:#f9fafb;
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:8px;
  min-width:160px;
}

.gizli {
  display:none;
}

@media print {
  body {
    background:white;
    padding:0;
  }

  .menu, .filtreler, .ekran-buton, .no-print {
    display:none !important;
  }

  .kutu {
    box-shadow:none;
    border:0;
  }

  th, td {
    font-size:12px;
    padding:6px;
  }
}

@media (max-width:900px) {
  .form-grid, .filtreler {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h2>ServisNET ASTİS Mali Belge Takip</h2>
<div class="alt-baslik">Fiş / fatura girişi, listeleme, filtreleme ve çıktı alma ekranı</div>

<div class="menu">
  <button class="ana-buton" onclick="ekranGoster('giris')">Belge Girişi</button>
  <button onclick="ekranGoster('liste')">Belge Listesi</button>
  <button onclick="ekranGoster('rapor')">Yazdır / Rapor</button>
</div>

<div id="mesaj" class="mesaj"></div>

<div id="giris" class="kutu">
  <h3>Belge Girişi</h3>

  <div class="form-grid">
    <div>
      <label>Belge Tarihi</label>
      <input type="date" id="belge_tarihi">
    </div>

    <div>
      <label>Belge Türü</label>
      <select id="belge_turu">
        <option value="Fiş">Fiş</option>
        <option value="Fatura">Fatura</option>
        <option value="E-Arşiv">E-Arşiv</option>
        <option value="E-Fatura">E-Fatura</option>
        <option value="Dekont">Dekont</option>
        <option value="Diğer">Diğer</option>
      </select>
    </div>

    <div>
      <label>Belge No</label>
      <input id="belge_no" placeholder="Fiş / fatura no">
    </div>

    <div>
      <label>Firma Ünvanı</label>
      <input id="firma_unvani" placeholder="Satıcı firma">
    </div>

    <div>
      <label>Kategori</label>
      <select id="kategori">
        <option value="Yakıt">Yakıt</option>
        <option value="Bakım-Onarım">Bakım-Onarım</option>
        <option value="Yedek Parça">Yedek Parça</option>
        <option value="Sigorta">Sigorta</option>
        <option value="Vergi-Harç">Vergi-Harç</option>
        <option value="Ofis">Ofis</option>
        <option value="Yemek">Yemek</option>
        <option value="Temizlik">Temizlik</option>
        <option value="Kırtasiye">Kırtasiye</option>
        <option value="Diğer">Diğer</option>
      </select>
    </div>

    <div>
      <label>Ödeme Şekli</label>
      <select id="odeme_sekli">
        <option value="Peşin">Peşin</option>
        <option value="Kredi Kartı">Kredi Kartı</option>
        <option value="Banka">Banka</option>
        <option value="Nakit">Nakit</option>
      </select>
    </div>

    <div>
      <label>Kart / Banka</label>
      <input id="kart_banka" placeholder="Halkbank, Vakıfbank, nakit vb.">
    </div>

    <div>
      <label>Matrah</label>
      <input id="matrah" type="text" placeholder="0,00" oninput="toplamHesapla()">
    </div>

    <div>
      <label>KDV</label>
      <input id="kdv" type="text" placeholder="0,00" oninput="toplamHesapla()">
    </div>

    <div>
      <label>Toplam</label>
      <input id="toplam" type="text" placeholder="0,00">
    </div>

    <div>
      <label>Dosyaya Kondu mu?</label>
      <select id="dosyaya_kondu">
        <option value="false">Hayır</option>
        <option value="true">Evet</option>
      </select>
    </div>

    <div class="tam">
      <label>Açıklama</label>
      <textarea id="aciklama" placeholder="Kısa açıklama yaz"></textarea>
    </div>
  </div>

  <br>
  <button class="yesil" onclick="belgeKaydet()">Belgeyi Kaydet</button>
  <button onclick="formTemizle()">Formu Temizle</button>
</div>

<div id="liste" class="kutu gizli">
  <h3>Belge Listesi</h3>

  <div class="filtreler">
    <div>
      <label>Başlangıç</label>
      <input type="date" id="filtre_baslangic" onchange="listele()">
    </div>

    <div>
      <label>Bitiş</label>
      <input type="date" id="filtre_bitis" onchange="listele()">
    </div>

    <div>
      <label>Kategori</label>
      <select id="filtre_kategori" onchange="listele()">
        <option value="">Tümü</option>
        <option>Yakıt</option>
        <option>Bakım-Onarım</option>
        <option>Yedek Parça</option>
        <option>Sigorta</option>
        <option>Vergi-Harç</option>
        <option>Ofis</option>
        <option>Yemek</option>
        <option>Temizlik</option>
        <option>Kırtasiye</option>
        <option>Diğer</option>
      </select>
    </div>

    <div>
      <label>Belge Türü</label>
      <select id="filtre_tur" onchange="listele()">
        <option value="">Tümü</option>
        <option>Fiş</option>
        <option>Fatura</option>
        <option>E-Arşiv</option>
        <option>E-Fatura</option>
        <option>Dekont</option>
        <option>Diğer</option>
      </select>
    </div>

    <div>
      <label>Arama</label>
      <input id="filtre_arama" placeholder="Firma / belge no" oninput="listele()">
    </div>
  </div>

  <div class="ozet" id="liste_ozet"></div>

  <button class="ekran-buton" onclick="listele()">Listeyi Yenile</button>
  <button class="ekran-buton" onclick="csvIndir()">CSV İndir</button>
  <button class="ekran-buton" onclick="window.print()">Yazdır</button>

  <br><br>
  <div id="liste_alani">Kayıtlar yükleniyor...</div>
</div>

<div id="rapor" class="kutu gizli">
  <h3>Peşin Belgeli Alışlar Raporu</h3>
  <p>Bu ekranı yazdırıp dosyana koyabilirsin. Evet, sonunda kâğıt devletinin istediği şeye geldik.</p>

  <div class="ozet" id="rapor_ozet"></div>

  <button class="ekran-buton" onclick="listele()">Raporu Güncelle</button>
  <button class="ekran-buton" onclick="window.print()">Yazdır</button>

  <br><br>
  <div id="rapor_alani"></div>
</div>

<script>
const supabaseUrl = "https://estdjfvlpebkmelzewjo.supabase.co";
const supabaseKey = "sb_publishable_YnjXKncf6BGO6gMa4bzAhA_66duBIov";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let belgeler = [];
let filtreliBelgeler = [];

function bugunYaz() {
  const bugun = new Date().toISOString().slice(0,10);
  document.getElementById("belge_tarihi").value = bugun;
}

function temizle(deger) {
  if (deger === null || deger === undefined || deger === "") return "";
  return String(deger)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function sayi(deger) {
  if (!deger) return 0;
  return Number(String(deger).replaceAll(".", "").replace(",", ".")) || 0;
}

function para(deger) {
  return Number(deger || 0).toLocaleString("tr-TR", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function mesajGoster(tur, metin) {
  const m = document.getElementById("mesaj");
  m.className = "mesaj " + tur;
  m.innerText = metin;

  setTimeout(() => {
    m.className = "mesaj";
    m.innerText = "";
  }, 3500);
}

function toplamHesapla() {
  const matrah = sayi(document.getElementById("matrah").value);
  const kdv = sayi(document.getElementById("kdv").value);
  document.getElementById("toplam").value = para(matrah + kdv);
}

function ekranGoster(ekran) {
  document.getElementById("giris").classList.add("gizli");
  document.getElementById("liste").classList.add("gizli");
  document.getElementById("rapor").classList.add("gizli");

  document.getElementById(ekran).classList.remove("gizli");

  if (ekran === "liste" || ekran === "rapor") {
    listele();
  }
}

function formTemizle() {
  document.getElementById("belge_turu").value = "Fiş";
  document.getElementById("belge_no").value = "";
  document.getElementById("firma_unvani").value = "";
  document.getElementById("kategori").value = "Yakıt";
  document.getElementById("odeme_sekli").value = "Peşin";
  document.getElementById("kart_banka").value = "";
  document.getElementById("matrah").value = "";
  document.getElementById("kdv").value = "";
  document.getElementById("toplam").value = "";
  document.getElementById("aciklama").value = "";
  document.getElementById("dosyaya_kondu").value = "false";
  bugunYaz();
}

async function belgeKaydet() {
  const belge = {
    belge_tarihi: document.getElementById("belge_tarihi").value,
    belge_turu: document.getElementById("belge_turu").value,
    firma_unvani: document.getElementById("firma_unvani").value,
    belge_no: document.getElementById("belge_no").value,
    kategori: document.getElementById("kategori").value,
    odeme_sekli: document.getElementById("odeme_sekli").value,
    kart_banka: document.getElementById("kart_banka").value,
    matrah: sayi(document.getElementById("matrah").value),
    kdv: sayi(document.getElementById("kdv").value),
    toplam: sayi(document.getElementById("toplam").value),
    aciklama: document.getElementById("aciklama").value,
    dosyaya_kondu: document.getElementById("dosyaya_kondu").value === "true"
  };

  if (!belge.belge_tarihi) {
    mesajGoster("hata", "Belge tarihi boş olamaz.");
    return;
  }

  if (!belge.belge_turu) {
    mesajGoster("hata", "Belge türü boş olamaz.");
    return;
  }

  if (belge.toplam === 0) {
    mesajGoster("hata", "Toplam tutar 0 olamaz.");
    return;
  }

  const { error } = await client.from("belgeler").insert([belge]);

  if (error) {
    mesajGoster("hata", "Kayıt hatası: " + error.message);
    return;
  }

  mesajGoster("basarili", "Belge kaydedildi.");
  formTemizle();
  await listele();
}

function filtrele() {
  const bas = document.getElementById("filtre_baslangic")?.value || "";
  const bit = document.getElementById("filtre_bitis")?.value || "";
  const kategori = document.getElementById("filtre_kategori")?.value || "";
  const tur = document.getElementById("filtre_tur")?.value || "";
  const arama = (document.getElementById("filtre_arama")?.value || "").toLowerCase();

  filtreliBelgeler = belgeler.filter(b => {
    if (bas && b.belge_tarihi < bas) return false;
    if (bit && b.belge_tarihi > bit) return false;
    if (kategori && b.kategori !== kategori) return false;
    if (tur && b.belge_turu !== tur) return false;

    const metin = [
      b.firma_unvani,
      b.belge_no,
      b.kategori,
      b.aciklama,
      b.kart_banka
    ].join(" ").toLowerCase();

    if (arama && !metin.includes(arama)) return false;

    return true;
  });
}

function ozetHtml(kayitlar) {
  const toplamMatrah = kayitlar.reduce((t, b) => t + Number(b.matrah || 0), 0);
  const toplamKdv = kayitlar.reduce((t, b) => t + Number(b.kdv || 0), 0);
  const genelToplam = kayitlar.reduce((t, b) => t + Number(b.toplam || 0), 0);

  return `
    <div class="ozet-kutu"><b>Kayıt</b><br>${kayitlar.length}</div>
    <div class="ozet-kutu"><b>Matrah</b><br>${para(toplamMatrah)} TL</div>
    <div class="ozet-kutu"><b>KDV</b><br>${para(toplamKdv)} TL</div>
    <div class="ozet-kutu"><b>Toplam</b><br>${para(genelToplam)} TL</div>
  `;
}

async function listele() {
  const { data, error } = await client
    .from("belgeler")
    .select("*")
    .order("belge_tarihi", { ascending:false })
    .order("created_at", { ascending:false });

  if (error) {
    document.getElementById("liste_alani").innerHTML = "<b>Hata:</b> " + temizle(error.message);
    return;
  }

  belgeler = data || [];
  filtrele();

  document.getElementById("liste_ozet").innerHTML = ozetHtml(filtreliBelgeler);
  document.getElementById("rapor_ozet").innerHTML = ozetHtml(filtreliBelgeler);

  let html = `
    <table>
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Tür</th>
          <th>Firma</th>
          <th>Belge No</th>
          <th>Kategori</th>
          <th>Ödeme</th>
          <th>Kart/Banka</th>
          <th class="sag">Matrah</th>
          <th class="sag">KDV</th>
          <th class="sag">Toplam</th>
          <th>Dosya</th>
          <th class="no-print">İşlem</th>
        </tr>
      </thead>
      <tbody>
  `;

  filtreliBelgeler.forEach(b => {
    html += `
      <tr>
        <td>${temizle(b.belge_tarihi)}</td>
        <td>${temizle(b.belge_turu)}</td>
        <td>${temizle(b.firma_unvani)}</td>
        <td>${temizle(b.belge_no)}</td>
        <td>${temizle(b.kategori)}</td>
        <td>${temizle(b.odeme_sekli)}</td>
        <td>${temizle(b.kart_banka)}</td>
        <td class="sag">${para(b.matrah)}</td>
        <td class="sag">${para(b.kdv)}</td>
        <td class="sag">${para(b.toplam)}</td>
        <td>${b.dosyaya_kondu ? "Evet" : "Hayır"}</td>
        <td class="no-print">
          <button onclick="dosyaDurumDegistir('${b.id}', ${!b.dosyaya_kondu})">Dosya</button>
          <button class="kirmizi" onclick="belgeSil('${b.id}')">Sil</button>
        </td>
      </tr>
    `;
  });

  html += "</tbody></table>";

  document.getElementById("liste_alani").innerHTML = html;
  document.getElementById("rapor_alani").innerHTML = html.replaceAll('class="no-print"', 'class="no-print"');
}

async function dosyaDurumDegistir(id, durum) {
  const { error } = await client
    .from("belgeler")
    .update({ dosyaya_kondu: durum })
    .eq("id", id);

  if (error) {
    mesajGoster("hata", "Güncelleme hatası: " + error.message);
    return;
  }

  await listele();
}

async function belgeSil(id) {
  const onay = confirm("Bu belge silinecek. Emin misin?");
  if (!onay) return;

  const { error } = await client
    .from("belgeler")
    .delete()
    .eq("id", id);

  if (error) {
    mesajGoster("hata", "Silme hatası: " + error.message);
    return;
  }

  mesajGoster("basarili", "Belge silindi.");
  await listele();
}

function csvIndir() {
  filtrele();

  const basliklar = [
    "Belge Tarihi",
    "Belge Türü",
    "Firma Ünvanı",
    "Belge No",
    "Kategori",
    "Ödeme Şekli",
    "Kart/Banka",
    "Matrah",
    "KDV",
    "Toplam",
    "Dosyaya Kondu",
    "Açıklama"
  ];

  const satirlar = filtreliBelgeler.map(b => [
    b.belge_tarihi,
    b.belge_turu,
    b.firma_unvani,
    b.belge_no,
    b.kategori,
    b.odeme_sekli,
    b.kart_banka,
    b.matrah,
    b.kdv,
    b.toplam,
    b.dosyaya_kondu ? "Evet" : "Hayır",
    b.aciklama
  ]);

  let csv = basliklar.join(";") + "\n";

  satirlar.forEach(s => {
    csv += s.map(x => '"' + String(x ?? "").replaceAll('"', '""') + '"').join(";") + "\n";
  });

  const blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pesin_belgeli_alislar.csv";
  a.click();
  URL.revokeObjectURL(url);
}

bugunYaz();
listele();
</script>

</body>
</html>
